# Run on an OCI Compute VM with /srv/fitbit-data on a mounted block volume.
# Restrict TCP 8086 with an OCI NSG; Docker-published ports bypass some host firewalls.
name: fitbit-database

services:
  influxdb:
    image: influxdb:1.11
    restart: unless-stopped
    environment:
      INFLUXDB_DB: "${INFLUXDB_DATABASE:?Set INFLUXDB_DATABASE}"
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
      INFLUXDB_ADMIN_USER: "${INFLUXDB_ADMIN_USER:?Set INFLUXDB_ADMIN_USER}"
      INFLUXDB_ADMIN_PASSWORD: "${INFLUXDB_ADMIN_PASSWORD:?Set INFLUXDB_ADMIN_PASSWORD}"
      INFLUXDB_USER: "${INFLUXDB_USERNAME:?Set INFLUXDB_USERNAME}"
      INFLUXDB_USER_PASSWORD: "${INFLUXDB_PASSWORD:?Set INFLUXDB_PASSWORD}"
      INFLUXDB_DATA_INDEX_VERSION: tsi1
    ports:
      - "8086:8086"
    volumes:
      - /srv/fitbit-data/influxdb:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8086/ping"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:?Set GF_SECURITY_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD}"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /srv/fitbit-data/grafana:/var/lib/grafana
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
