# Keeps the SHA-pinned actions in .github/workflows current: Dependabot moves each pin and its
# "# vX.Y.Z" comment together, in one grouped pull request a week. The cooldown skips releases
# younger than a week, so a compromised tag has time to be caught first; security updates ignore it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
