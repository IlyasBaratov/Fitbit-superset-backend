# Runs the test suite on every push to main and every pull request.
#
# No secrets and no environment: the tests mock InfluxDB, Gemini and the providers, and keep a
# developer's .env out with monkeypatch.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.14 = Dockerfile.api (python:3.14-slim); 3.10 = the worker image (thisisarpanghosh/fitbit-fetch-data:latest)
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # The requirements give ranges and there is no lockfile: log what this run tested.
      - name: Log the tested versions
        run: python -m pip freeze | grep -iE '^(fastapi|starlette|pydantic|google-genai|influxdb)=='

      - name: Tests
        run: python -m pytest -q
