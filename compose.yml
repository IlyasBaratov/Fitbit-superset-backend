name: fitbit-superset-backend

services:
  ai-api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        API_UID: "${API_UID:-10001}"
    image: fitbit-ai-api:latest
    restart: unless-stopped
    read_only: true
    # Must match the collector's appuser: docker compose exec fitbit-fetch-data id -u
    user: "${API_UID:-10001}"
    tmpfs:
      - /tmp
    volumes:
      - ./tokens:/app/tokens
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AI_API_TOKEN: "${AI_API_TOKEN:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      MODEL_NAME: "${MODEL_NAME:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
      AI_DEFAULT_ANALYSIS_DAYS: "${AI_DEFAULT_ANALYSIS_DAYS:-7}"
      AI_MAX_ANALYSIS_DAYS: "${AI_MAX_ANALYSIS_DAYS:-90}"
      USER_ID: "${USER_ID:-user_001}"
      HEALTH_API_PROVIDER: "${HEALTH_API_PROVIDER:-fitbit}"
      DEVICE_ID: "${DEVICE_ID:-fitbit_air_001}"
      LOCAL_TIMEZONE: "${LOCAL_TIMEZONE:-Automatic}"
      TZ: "${TZ:-America/Los_Angeles}"
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      INFLUXDB_DATABASE: "${INFLUXDB_DATABASE:-FitbitHealthStats}"
      INFLUXDB_USERNAME: "${INFLUXDB_USERNAME:-fitbit_user}"
      INFLUXDB_PASSWORD: "${INFLUXDB_PASSWORD:-fitbit_password}"
      CALENDAR_IDS: "${CALENDAR_IDS:-primary}"
      CALENDAR_CLIENT_ID: "${CALENDAR_CLIENT_ID:-}"
      CALENDAR_CLIENT_SECRET: "${CALENDAR_CLIENT_SECRET:-}"
      CALENDAR_TOKEN_FILE_PATH: /app/tokens/google_calendar.token
      CALENDAR_REDIRECT_URI: "${CALENDAR_REDIRECT_URI:-http://localhost:8000/api/calendar/callback}"
      CALENDAR_AI_INCLUDE_TITLES: "${CALENDAR_AI_INCLUDE_TITLES:-true}"
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  fitbit-fetch-data:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: fitbit-superset-backend:latest
    container_name: fitbit-fetch-data
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./tokens:/app/tokens
    environment:
      FITBIT_LOG_FILE_PATH: /app/logs/fitbit.log
      TOKEN_FILE_PATH: /app/tokens/fitbit.token
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      HEALTH_API_PROVIDER: "${HEALTH_API_PROVIDER:-fitbit}"
      AUTO_DATE_RANGE: "true"
      MANUAL_START_DATE: "${MANUAL_START_DATE:-}"
      MANUAL_END_DATE: "${MANUAL_END_DATE:-}"
      DRY_RUN_MODE: "${DRY_RUN_MODE:-false}"
      REQUEST_MAX_RETRIES: "${REQUEST_MAX_RETRIES:-5}"
      REQUEST_TIMEOUT_SECONDS: "${REQUEST_TIMEOUT_SECONDS:-30}"
      INFLUXDB_VERSION: "1"
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      INFLUXDB_USERNAME: "${INFLUXDB_USERNAME:-fitbit_user}"
      INFLUXDB_PASSWORD: "${INFLUXDB_PASSWORD:-fitbit_password}"
      INFLUXDB_DATABASE: "${INFLUXDB_DATABASE:-FitbitHealthStats}"
      INFLUXDB_BUCKET: "${INFLUXDB_BUCKET:-}"
      INFLUXDB_ORG: "${INFLUXDB_ORG:-}"
      INFLUXDB_TOKEN: "${INFLUXDB_TOKEN:-}"
      INFLUXDB_URL: "${INFLUXDB_URL:-}"
      INFLUXDB_V3_ACCESS_TOKEN: "${INFLUXDB_V3_ACCESS_TOKEN:-}"
      CLIENT_ID: "${CLIENT_ID:-}"
      CLIENT_SECRET: "${CLIENT_SECRET:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_HEALTH_BASE_URL: "${GOOGLE_HEALTH_BASE_URL:-https://health.googleapis.com}"
      GOOGLE_HEALTH_API_VERSION: "${GOOGLE_HEALTH_API_VERSION:-v4}"
      GOOGLE_OAUTH_TOKEN_URL: "${GOOGLE_OAUTH_TOKEN_URL:-https://oauth2.googleapis.com/token}"
      CALENDAR_SYNC_ENABLED: "${CALENDAR_SYNC_ENABLED:-false}"
      CALENDAR_IDS: "${CALENDAR_IDS:-primary}"
      CALENDAR_CLIENT_ID: "${CALENDAR_CLIENT_ID:-}"
      CALENDAR_CLIENT_SECRET: "${CALENDAR_CLIENT_SECRET:-}"
      CALENDAR_TOKEN_FILE_PATH: /app/tokens/google_calendar.token
      CALENDAR_SYNC_DAYS_BACK: "${CALENDAR_SYNC_DAYS_BACK:-7}"
      CALENDAR_SYNC_DAYS_AHEAD: "${CALENDAR_SYNC_DAYS_AHEAD:-1}"
      DEVICENAME: "${DEVICENAME:-Your_Device_Name}"
      USER_ID: "${USER_ID:-user_001}"
      DEVICE_ID: "${DEVICE_ID:-fitbit_air_001}"
      DEVICE_METADATA_STATE_PATH: /app/tokens/device_metadata_state.json
      LOCAL_TIMEZONE: "${LOCAL_TIMEZONE:-Automatic}"
      TZ: "${TZ:-America/Los_Angeles}"
    depends_on:
      influxdb:
        condition: service_healthy

  influxdb:
    restart: unless-stopped
    image: influxdb:1.11
    container_name: influxdb
    hostname: influxdb
    environment:
      INFLUXDB_DB: "${INFLUXDB_DATABASE:-FitbitHealthStats}"
      INFLUXDB_USER: "${INFLUXDB_USERNAME:-fitbit_user}"
      INFLUXDB_USER_PASSWORD: "${INFLUXDB_PASSWORD:-fitbit_password}"
      INFLUXDB_DATA_INDEX_VERSION: tsi1
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "influx", "-execute", "SHOW DATABASES"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  grafana:
    restart: unless-stopped
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-admin}"
      GF_PLUGINS_PREINSTALL: marcusolsson-hourly-heatmap-panel
      TZ: "${TZ:-America/Los_Angeles}"
    volumes:
      - ./grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
